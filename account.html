<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore | Customer Account</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #172033;
        }

        header {
            background: #101828;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .brand { font-size: 24px; font-weight: bold; }

        main {
            max-width: 460px;
            margin: 45px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 30px #10182812;
        }

        h1 { margin-top: 0; }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tabs button {
            flex: 1;
            padding: 12px;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
            background: #e9edf5;
            font-size: 15px;
        }

        .tabs button.active {
            background: #155eef;
            color: white;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d0d5dd;
            border-radius: 7px;
            font-size: 15px;
        }

        .submit {
            width: 100%;
            margin-top: 23px;
            padding: 14px;
            border: 0;
            border-radius: 7px;
            background: #155eef;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .submit:disabled { opacity: .6; cursor: wait; }

        #message {
            margin-top: 18px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .hint { color: #667085; font-size: 13px; }

        #accountInfo { display: none; }

        @media (max-width: 520px) {
            main { margin: 25px 15px; padding: 22px; }
        }
    </style>
</head>
<body>
<header>
    <a class="brand" href="index.html">TechStore</a>
    <a href="index.html">Continue shopping</a>
</header>

<main>
    <section id="authSection">
        <h1 id="heading">Welcome back</h1>
        <p>Sign in or create your TechStore customer account.</p>

        <div class="tabs">
            <button id="loginTab" class="active" type="button">Login</button>
            <button id="registerTab" type="button">Register</button>
        </div>

        <form id="authForm">
            <label for="username">Username</label>
            <input
                id="username"
                name="username"
                type="text"
                minlength="3"
                maxlength="30"
                pattern="[A-Za-z0-9_]{3,30}"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                minlength="8"
                maxlength="72"
                autocomplete="current-password"
                required
            >

            <p id="passwordHint" class="hint" hidden>
                Use at least 8 characters.
            </p>

            <button id="submitButton" class="submit" type="submit">
                Login
            </button>
        </form>

        <div id="message" role="status" aria-live="polite"></div>
    </section>

    <section id="accountInfo">
        <h1>You're signed in</h1>
        <p id="welcome"></p>
        <button id="logoutButton" class="submit" type="button">Logout</button>
        <p><a href="index.html">Continue shopping</a></p>
    </section>
</main>

<script>
    const form = document.getElementById('authForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const heading = document.getElementById('heading');
    const submitButton = document.getElementById('submitButton');
    const message = document.getElementById('message');
    const passwordHint = document.getElementById('passwordHint');
    const authSection = document.getElementById('authSection');
    const accountInfo = document.getElementById('accountInfo');

    let mode = 'login';

    function showMessage(text, isError = false) {
        message.textContent = text;
        message.style.color = isError ? '#b42318' : '#067647';
    }

    function setMode(newMode) {
        mode = newMode;
        const isRegister = mode === 'register';

        heading.textContent = isRegister ? 'Create account' : 'Welcome back';
        submitButton.textContent = isRegister ? 'Create account' : 'Login';
        loginTab.classList.toggle('active', !isRegister);
        registerTab.classList.toggle('active', isRegister);
        passwordHint.hidden = !isRegister;
        passwordInput.autocomplete = isRegister ? 'new-password' : 'current-password';
        showMessage('');
    }

    loginTab.addEventListener('click', () => setMode('login'));
    registerTab.addEventListener('click', () => setMode('register'));

    async function apiRequest(path, body) {
        const response = await fetch('/api/auth/' + path, {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(data.error || 'Request failed. Please try again.');
        }

        return data;
    }

    function showSignedIn(user) {
        authSection.style.display = 'none';
        accountInfo.style.display = 'block';
        document.getElementById('welcome').textContent =
            'Welcome, ' + user.username + '. Role: ' + user.role;
    }

    function continueAfterLogin(user) {
        const next = new URLSearchParams(window.location.search).get('next');

        if (user.role !== 'customer') {
            if (next === 'checkout' || next === 'orders') {
                showMessage('Please use a customer account for shopping.', true);
            }
            return;
        }

        if (next === 'checkout') {
            window.location.href = '/?checkout=1';
        } else if (next === 'orders') {
            window.location.href = '/my-orders.html';
        } else {
            window.location.href = '/';
        }
    }


    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        showMessage('');

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (mode === 'register' && password.length < 8) {
            showMessage('Password must contain at least 8 characters.', true);
            return;
        }

        submitButton.disabled = true;

        try {
            if (mode === 'register') {
                await apiRequest('register', { username, password });
                showMessage('Account created successfully. You can now log in.');
                setMode('login');
                usernameInput.value = username;
                passwordInput.value = '';
                passwordInput.focus();
            } else {
                const data = await apiRequest('login', { username, password });
                showSignedIn(data.user);
                continueAfterLogin(data.user);
            }
        } catch (error) {
            showMessage(error.message, true);
        } finally {
            submitButton.disabled = false;
        }
    });

    document.getElementById('logoutButton').addEventListener('click', async () => {
        try {
            await apiRequest('logout', {});
            accountInfo.style.display = 'none';
            authSection.style.display = 'block';
            passwordInput.value = '';
            setMode('login');
            showMessage('You have logged out successfully.');
        } catch (error) {
            showMessage(error.message, true);
        }
    });

    fetch('/api/auth/me', { credentials: 'same-origin' })
        .then(async response => {
            if (!response.ok) return null;
            return response.json();
        })
        .then(data => {
            if (data && data.user) {
                showSignedIn(data.user);
                continueAfterLogin(data.user);
            }
        })
        .catch(() => {});
</script>
</body>
</html>
